server:
  port: 8085

#mybatis-plus:
#  configuration:
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus:
  # 精确限定扫描路径（去掉classpath*:）
  mapper-locations: classpath:mapper/*.xml
  # 必须添加实体类包扫描,为实体类设置别名
  type-aliases-package: com.schoolwork.epsys.model
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3308/devices?characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: "${MYSQL_PASSWORD:change-me-local}"
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: "${RABBITMQ_PASSWORD:change-me-local}"
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  data:
    redis:
      host: localhost  # 新版本的配置位置
      port: 6379
      database: 0
      timeout: 1800000
      password:
      lettuce:
        pool:
          max-active: 20
          max-wait: -1
          max-idle: 5
          min-idle: 0
  redis:
    redisson:
      config: |
        singleServerConfig:
          address: "redis://localhost:6379"
          database: 0
          password: null
          connectionMinimumIdleSize: 10
          connectionPoolSize: 64
          timeout: 3000
          pingConnectionInterval: 10000
        threads: 16
        nettyThreads: 32
        codec: !<org.redisson.codec.JsonJacksonCodec> {}
        transportMode: "NIO"
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

dispatch:
  auto:
    enabled: ${DISPATCH_AUTO_ENABLED:true}
    claim-window-seconds: ${DISPATCH_CLAIM_WINDOW_SECONDS:600}
    scan-delay-ms: ${DISPATCH_SCAN_DELAY_MS:30000}
    scan-batch-size: 100
    publish-delay-ms: ${DISPATCH_PUBLISH_DELAY_MS:2000}
    publish-batch-size: 50
    confirm-timeout-ms: 5000
    agent-deadline-seconds: 60
    manual-permission-id: ${DISPATCH_MANUAL_PERMISSION_ID:1001}

knowledge:
  work-order-ingestion:
    enabled: ${WORK_ORDER_KNOWLEDGE_ENABLED:true}
    publish-delay-ms: ${WORK_ORDER_KNOWLEDGE_PUBLISH_DELAY_MS:2000}
    publish-batch-size: 50
    confirm-timeout-ms: 5000

device-binding:
  saga:
    enabled: ${DEVICE_BINDING_SAGA_ENABLED:true}
    publish-delay-ms: ${DEVICE_BINDING_PUBLISH_DELAY_MS:2000}
    publish-batch-size: 50
    confirm-timeout-ms: 5000
